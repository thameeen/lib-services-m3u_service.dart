name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Full Flutter Project Structure
        run: |
          flutter create . --org com.heedartv.app --project-name heedar_tv --platforms=android
          mkdir -p lib
          # نسخ ملف الواجهة الذي وضعناه إذا كان موجوداً، أو تخطيه
          if [ -f "lib/main.dart" ]; then echo "Main exists"; fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeedarTV-App
          path: build/app/outputs/flutter-apk/app-release.apk
